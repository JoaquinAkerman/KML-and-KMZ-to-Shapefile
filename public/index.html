
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMZ/KML to Shapefile (Agras T50)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Convertidor KMZ/KML a Shapefile (Agras T50)</h1>
      <p class="subtitle">Convierte KMZ o KML a shapefile compatible con Agras T50 y T100 en WGS 84 (EPSG:4326)</p>

      <form id="convertForm">
        <label for="kmlFile">Selecciona un archivo KMZ o KML</label>
        <input id="kmlFile" name="kmlFile" type="file" accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml" required />

        <button type="submit">Convertir y Descargar ZIP</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <!-- Apoyo voluntario -->
      <div class="cafecito">
        <p>☕ ¿Te resultó útil esta herramienta?</p>
        <p>Si te sirvió, podés apoyar su desarrollo.</p>
        <a
          href="https://cafecito.app/joaquinak"
          target="_blank"
          rel="noopener noreferrer"
          class="cafecito-btn"
        >
          ☕ Invitame un Cafecito
        </a>
      </div>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
